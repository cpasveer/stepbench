# Stiffness score: material, loads and solver settings.
#
# Every number has a unit and a note on where it comes from. They are fixed
# for every part, so two answers to the same task are always compared under
# the same conditions, and the same file always gives the same figure.

[material]
name = "aluminium 6061-T6"
E = 68900.0          # MPa (N/mm2)
nu = 0.33
density = 2.70       # g/cm3
source = "handbook values for 6061-T6 (ASM). Chosen over PLA because aluminium is isotropic and linear up to yield, so a linear static model is honest for it; a printed PLA part is layered and its stiffness depends on print direction. Every ratio against the reference is independent of E; only the absolute figures scale with it (PLA, E about 3500 MPa, is about 20 x more flexible)."

[loads]
force = 1.0          # N, each of three directions
moment = 1.0         # N mm, about each of three axes
source = "unit loads: the result is linear, so the size of the load does not matter, only its direction. Directions are the loaded mount's own axes: x and y along its face, z along its bolts."

[mesh]
element_size = 2.0   # mm, longest element edge
curvature_points = 12 # elements per full circle on curved faces (holes get finer)
element = "10-node (quadratic) tetrahedron, curved: edge middles on the true surface"
element_order = 2    # 2: curved elements (round members within 1 %); 1: straight (a 4-6 mm rod about 6 % too flexible)
precision = 2.0      # percent claimed at element_size
quick_element_size = 3.0  # mm, --quick
quick_precision = 4.0     # percent claimed at quick_element_size
screen_element_size = 4.0 # mm, first stage of requirement mode (--screen)
screen_precision = 15.0   # percent claimed at screen_element_size (largest seen 10.3 %, on a 4 mm rib)
max_retries = 3      # times the mesher re-splits a surface whose edges cross before giving up (gmsh default 10; every retry costs about 4 x the one before: 10 took 83 minutes on one round 5 part, only to fail; no round 5 part that meshes needed even one)
source = "from the convergence study in docs/stiffness.md (4 parts, sizes 4 to 1.2 mm): at 2 mm every figure is within 1.1 % of the 1.2 mm result, so +/- 2 % is claimed; at 3 mm within 2.3 %, claimed +/- 4 %; 4 mm was 10 % off on the ribbed bracket and is not offered"

[seat]
plane_tolerance = 0.06  # mm: surface this close to a mounting face counts as seated on it
hole_tolerance = 0.15   # mm: hole-wall surface this close to the bolt's clearance radius counts as the hole
source = "a little more than the grader's own seat gap (0.05 mm), so every seat the grader accepts is found"

[requirement]
mode = "spec"           # "spec": from the task alone (below); "reference_fraction": a fraction of the reference's figure
# spec: at each loaded mount, required stiffness = design load / allowed deflection
working_stress = 1.2    # N/mm2: design load = this x the bolts' tensile stress area at the weaker of the two mounts
deflection_ratio = 250  # allowed deflection = span / this (span: held mount to loaded mount)
fraction = 0.5          # reference_fraction mode only
source = "spec: calibrated once on 17 level 2 and 3 tasks (references, block and rod baselines, archived model answers): at 1.2 N/mm2 and span/250 every lazy answer fails and 15 of 17 references pass; see docs/stiffness.md. The load grows with the bolts a joint was given, the allowed deflection with the span, as in a building code (span/250). Nothing is taken from the reference answer."

[requirement.stress_area]   # mm2, ISO 898-1 tensile stress area of coarse-thread bolts
M2 = 2.07
M2_5 = 3.39
M3 = 5.03
M4 = 8.78
M5 = 14.2
M6 = 20.1
M8 = 36.6
M10 = 58.0
M12 = 84.3

# ---- materials per process (STRENGTH's allowable stress; see docs/stiffness.md)
# The stiffness figure keeps using [material] (aluminium): its requirement is
# calibrated in that material. Stress under a given load does not depend on
# the modulus (only a little on Poisson's ratio), so STRENGTH reads its
# stresses off the same solve and compares them with the process's allowable.
[materials.fdm]
name = "PLA, filament printed"
E = 3500.0        # MPa
nu = 0.35
density = 1.24       # g/cm3
strength = 40.0   # MPa, printed parts (the resin alone reaches about 60; across layers printed PLA is weaker)
safety = 2.0
source = "Prusament PLA and Ultimaker PLA technical data sheets: printed tensile strength 45-60 MPa in the plane, about 30-40 MPa across layers; 40 MPa with a factor 2 gives 20 MPa"

[materials.pbf]
name = "PA12, powder bed fusion (MJF / SLS)"
E = 1800.0
nu = 0.40
density = 1.01       # g/cm3
strength = 48.0
safety = 2.0
source = "HP 3D High Reusability PA 12 data sheet (MJF): tensile strength 48 MPa in XY and Z, modulus about 1800 MPa; factor 2 gives 24 MPa"

[materials.moulding]
name = "ABS, injection moulded"
E = 2300.0
nu = 0.35
density = 1.05       # g/cm3
strength = 40.0
safety = 2.0
source = "general-purpose moulding ABS data sheets (e.g. INEOS Terluran GP-35): yield stress about 40-45 MPa, modulus about 2300 MPa; factor 2 gives 20 MPa"

[strength]
min_radius = 1.0         # mm: a loaded inside corner must be rounded at least this much
loaded_share = 0.25      # an inside corner counts as loaded where the stress beside it reaches this share of the allowable
average_radius = 0.5     # mm: stress is averaged over a ball of this radius (a fixed volume)
mount_zone = 3.0         # mm: points this close to a mount's seat or bolt holes are left out (the clamp is an idealisation)
corner_reach = 1.0       # mm: the stress 'beside' a corner is read within this distance of it
precision = 5.0          # percent claimed for the averaged stress (Peterson within 1.3 %, averaged stress converged within 0.5 %)
curvature_points = 32    # elements per full circle on curved faces for the analysis STRENGTH reads (12 gives notch peaks 12 % low)
source = "option A, chosen by the maintainer: a minimum radius at loaded inside corners and stress averaged over a small fixed volume, under the six design load cases of the stiffness check, against strength / safety factor of the process's material"

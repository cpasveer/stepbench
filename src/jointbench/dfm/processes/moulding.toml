# Injection moulding, simple two-part mould: the rules and their limits.
#
# Every limit has a value, a unit and a short note on where it comes from.
# "kind": "min" = the measured number must be at least the limit, "max" =
# at most the limit.
#
# The limits are for a general-purpose plastic such as ABS or PP in a
# straight-pull mould with no side actions (no sliders, no lifters). That
# is the cheap mould; a part that needs side actions fails UNDERCUT here,
# on purpose.

[process]
id = "moulding"
name = "Injection moulding (two-part mould, straight pull)"
status = "built"
direction = "pull direction"
direction_meaning = "the line along which the two mould halves separate; one half pulls each way"

[rules.IM_DRAFT]
title = "Draft on faces along the pull"
kind = "min"
value = 1.0
unit = "deg"
source = "Protolabs and most moulding guides: at least 1 degree, more for textured faces"

[rules.IM_UNDERCUT]
title = "No undercuts for a two-part mould"
kind = "max"
value = 0.0
unit = "mm2"
source = "a straight-pull mould without side actions releases only what each half can see along the pull"

[rules.IM_WALL_MIN]
title = "Minimum wall thickness"
kind = "min"
value = 1.0
unit = "mm"
source = "Protolabs recommended wall for ABS starts at about 1.1 mm; thinner walls do not fill"

[rules.IM_WALL_MAX]
title = "Maximum wall thickness"
kind = "max"
value = 4.0
unit = "mm"
source = "Protolabs recommended wall for ABS ends at about 3.5-4 mm; thicker sections sink and void"

[rules.IM_WALL_UNIFORM]
title = "Even wall thickness"
kind = "max"
value = 1.5
unit = "ratio"
source = "thickest section over the nominal wall; guides ask for variation within about 25-50 % to avoid sink and warp"

[rules.IM_RIB_RATIO]
title = "Rib thickness relative to the wall"
kind = "max"
value = 0.6
unit = "ratio"
source = "rib thickness at its base over the wall it stands on; Protolabs and others give 40-60 %"

[rules.IM_SHARP_CORNER]
title = "No sharp inner corners"
kind = "min"
value = 0.5
unit = "ratio"
source = "inner corner radius over the nominal wall; Protolabs: at least 0.5 x wall, a sharp corner counts as radius 0"

# ---- how the checker measures

[settings.sample_spacing]
value = 1.5
unit = "mm"
source = "longest side of a sample triangle: the part is meshed this fine and every triangle is judged at its centre"

[settings.corner_turn]
value = 30.0
unit = "deg"
source = "an edge where the surface turns by at least this much is a corner; gentler bends are not"

[settings.draft_face_band]
value = 10.0
unit = "deg"
source = "faces within this angle of the pull line count as 'along the pull' and need draft"

[settings.candidate_faces]
value = 6
unit = "faces"
source = "when no direction is stated, the normals of the largest flat faces are tried as the pull line, besides the three axes"

# ---- material actually used (for a material score; not a rule)
[material]
name = "ABS"
density = 1.05            # g/cm3
source = "the part's own volume per shot (runners and sprues left out: they depend on the tool). Cooling time, and with it cycle time, grows with the square of the thickest section; it is reported beside the mass as information."

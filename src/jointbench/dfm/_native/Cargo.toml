[package]
name = "fastball"
version = "0.1.0"
edition = "2021"
description = "JointBench: largest-ball section thickness on a triangle mesh (compiled helper for jointbench.dfm)"
license = "Apache-2.0"

[lib]
name = "_fastball"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
